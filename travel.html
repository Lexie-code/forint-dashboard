<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Forint — 欧洲出行助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{--ink:#18231c;--muted:#6e776f;--paper:#f7f7f3;--white:#fff;--line:#e6e8e2;--lime:#c9f36a;--green:#183f2e;--soft:#f1f5eb;--warn:#fff5d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans","Noto Sans SC",sans-serif;letter-spacing:-.015em}.shell{max-width:1200px;min-height:100vh;margin:auto;background:#fbfbf8;border-inline:1px solid var(--line)}header{height:78px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:-.04em}.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lime);font-family:Georgia;font-size:20px;font-style:italic}.back{font-size:14px;color:var(--green);font-weight:600;text-decoration:none}main{padding:48px}.eyebrow{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.11em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr 270px;gap:30px;align-items:end;margin-bottom:31px}.hero h1{margin:9px 0 0;font-size:42px;line-height:1.1;letter-spacing:-.06em}.hero p{font-size:13px;color:var(--muted);line-height:1.65;margin:0}.search{background:var(--green);color:white;border-radius:18px;padding:27px 29px}.search-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.search h2{font-size:17px;margin:0;letter-spacing:-.03em}.status{font-size:11px;color:#b9cbb9}.search-row{display:grid;grid-template-columns:1fr 135px 110px;gap:9px}.input,.select{border:0;border-radius:9px;background:white;color:var(--ink);padding:13px;font-size:13px;outline-color:var(--lime)}.generate{border:0;border-radius:9px;background:var(--lime);color:var(--ink);font-size:13px;font-weight:700}.hint{margin:11px 0 0;color:#bfd0c0;font-size:11px}.guide{margin-top:18px}.empty{padding:45px 0;text-align:center;color:var(--muted);font-size:13px}.result-head{display:flex;justify-content:space-between;align-items:start;margin:26px 0 17px}.result-head h2{font-size:23px;margin:5px 0 0;letter-spacing:-.045em}.pill{font-size:11px;background:var(--soft);color:var(--green);padding:7px 10px;border-radius:999px}.alert{background:var(--warn);border:1px solid #f5e8bd;border-radius:12px;padding:13px 15px;font-size:12px;line-height:1.6;color:#665522;margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:var(--white);border-radius:14px;padding:19px}.card h3{margin:0 0 10px;font-size:15px;letter-spacing:-.025em}.card p,.card li{margin:0;color:var(--muted);font-size:12px;line-height:1.65}.wide{grid-column:1 / -1}.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.source{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink)}.source b{font-size:12px;display:block}.source span{display:block;color:var(--muted);font-size:10px;line-height:1.45;margin-top:4px}.route{border:0;background:var(--soft);color:var(--green);padding:10px 12px;border-radius:8px;font-size:12px;font-weight:600}.route.secondary{background:#fff;border:1px solid var(--line)}.route-field{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:13px}.route-hint{display:block;margin-top:9px;color:var(--muted);font-size:11px}.footnote{margin-top:20px;color:var(--muted);font-size:11px;line-height:1.6}@media(max-width:760px){header,main{padding-left:22px;padding-right:22px}.hero{display:block}.hero p{margin-top:17px}.hero h1{font-size:34px}.search-row,.cards,.source-grid{grid-template-columns:1fr}.search-row{gap:8px}.wide{grid-column:auto}.route-field{grid-template-columns:1fr}.route{width:100%}header{height:66px}}
    </style>
  </head>
  <body>
    <div class="shell"><header><div class="brand"><span class="mark">f</span>forint.</div><a class="back" href="index.html">← 返回仪表盘</a></header><main>
      <section class="hero"><div><div class="eyebrow">Europe transit brief</div><h1>落地之后，直接出发。</h1></div><p>输入机场、火车站或地铁站，拿到当地常用 App、换乘路线入口和到站后的实操顺序。</p></section>
      <section class="search"><div class="search-top"><h2>即时出行攻略</h2><span class="status" id="status">等待输入地点</span></div><div class="search-row"><input class="input" id="place" placeholder="例如：Budapest Ferenc Liszt Airport / Wien Hbf" autofocus /><select class="select" id="mode"><option value="auto">自动识别类型</option><option value="airport">机场</option><option value="train">火车站</option><option value="metro">地铁站</option></select><button class="generate" id="generate">生成攻略</button></div><p class="hint">地点通过 OpenStreetMap 实时识别；工具推荐优先使用当地常见出行 App，实时班次与价格仍以 App 内显示为准。</p></section>
      <section class="guide" id="guide"><div class="empty">输入一个欧洲交通枢纽后，当地常用 App 和换乘攻略会出现在这里。</div></section>
    </main></div>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
    <script>
      const schengen=new Set(['at','be','bg','hr','cz','dk','ee','fi','fr','de','gr','hu','it','lv','li','lt','lu','mt','nl','no','pl','pt','ro','sk','si','es','se','ch','is']);
      const $=s=>document.querySelector(s); let current=null;
      const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
      function inferType(name,chosen){if(chosen!=='auto')return chosen;const n=name.toLowerCase();if(/airport|aeroport|flugha|repülőtér|lentoasema/.test(n))return'airport';if(/metro|subway|underground|u-bahn/.test(n))return'metro';return'train'}
      function toolsFor(country,city){const shared=[{name:'Google Maps',desc:'查公交、步行、出口和替代路线',url:'https://www.google.com/maps'},{name:'Bolt / Uber',desc:'打车备选；下单前比价并核对上车点',url:'https://bolt.eu/'}],sets={hu:[{name:'BudapestGO',desc:'布达佩斯公交、地铁、电车路线与票券',url:'https://bkk.hu/en/tickets-and-passes/budapestgo/'},{name:'Bolt',desc:'布达佩斯常用打车选择',url:'https://bolt.eu/hu-hu/cities/budapest/'},{name:'MÁV',desc:'匈牙利城际列车与时刻查询',url:'https://www.mavcsoport.hu/en'}],at:[{name:'WienMobil',desc:'维也纳地铁、电车、公交路线和车票',url:'https://www.wienerlinien.at/wienmobil'},{name:'ÖBB',desc:'奥地利铁路、城际和跨境列车',url:'https://www.oebb.at/en/'},{name:'Bolt',desc:'打车或最后一公里备选',url:'https://bolt.eu/'}],fr:[{name:'Bonjour RATP',desc:'巴黎地铁、RER、公交路线与票券',url:'https://www.bonjour-ratp.fr/'},{name:'SNCF Connect',desc:'法国火车、站台与改签信息',url:'https://www.sncf-connect.com/en-en/'},{name:'Uber',desc:'打车或晚间出行备选',url:'https://www.uber.com/'}],gb:[{name:'TfL Go',desc:'伦敦地铁、公交、铁路实时状态',url:'https://tfl.gov.uk/maps_/tfl-go'},{name:'Citymapper',desc:'伦敦换乘方案和步行出口提示',url:'https://citymapper.com/'},{name:'Uber',desc:'打车与预约出行',url:'https://www.uber.com/'}],de:[{name:'DB Navigator',desc:'德国城际/区域火车、站台和延误',url:'https://int.bahn.de/en'},{name:'Citymapper',desc:'大城市本地交通的换乘备选',url:'https://citymapper.com/'},{name:'FREE NOW',desc:'出租车和网约车入口',url:'https://www.free-now.com/'}],nl:[{name:'NS',desc:'荷兰火车、换乘和服务提醒',url:'https://www.ns.nl/en'},{name:'9292',desc:'公交、电车、地铁一体化查路线',url:'https://9292.nl/en'},{name:'Uber',desc:'打车备选',url:'https://www.uber.com/'}],cz:[{name:'PID Lítačka',desc:'布拉格公交、地铁、电车路线与票券',url:'https://pidlitacka.cz/home?lang=en'},{name:'RegioJet',desc:'捷克及中欧城际列车备选',url:'https://regiojet.com/'},{name:'Bolt',desc:'打车备选',url:'https://bolt.eu/'}],pl:[{name:'Jakdojade',desc:'波兰城市公交与地铁路线',url:'https://jakdojade.pl/'},{name:'PKP Intercity',desc:'波兰城际火车',url:'https://www.intercity.pl/en/'},{name:'Bolt',desc:'打车备选',url:'https://bolt.eu/'}],it:[{name:'Trenitalia',desc:'意大利火车、站台和购票',url:'https://www.trenitalia.com/en.html'},{name:'Moovit',desc:'公交、地铁与步行换乘',url:'https://moovitapp.com/'},{name:'FREE NOW',desc:'出租车和网约车入口',url:'https://www.free-now.com/'}],es:[{name:'Renfe',desc:'西班牙铁路与城际列车',url:'https://www.renfe.com/es/en'},{name:'Moovit',desc:'公交、地铁与步行换乘',url:'https://moovitapp.com/'},{name:'Cabify',desc:'西班牙常见网约车备选',url:'https://cabify.com/'}]};return sets[country]||shared}
      const appCards=apps=>`<div class="source-grid">${apps.map(a=>`<a class="source" target="_blank" rel="noreferrer" href="${a.url}"><b>${a.name} ↗</b><span>${a.desc}</span></a>`).join('')}</div>`;
      function transitText(type){if(type==='airport')return `<ul><li><b>先开路线 App：</b>把目的地设为住宿，比较机场快线、普通公交和打车的时间/费用。</li><li><b>找对上车层：</b>出到达大厅后按 Train / Bus / Taxi 标识走；打车 App 的上车点通常在指定车道。</li><li><b>别急着买票：</b>先确认你去的是市中心还是具体酒店，避免买错区间、方向或机场专线。</li></ul>`;if(type==='metro')return `<ul><li><b>认“终点站”而非只认线路号：</b>进站前在 App 里看清行驶方向，避免坐反。</li><li><b>换乘时看出口：</b>App 的步行导航通常比站内图更直观；大站预留 5–10 分钟换乘时间。</li><li><b>出站前截屏：</b>保存路线和站名，地下信号不稳时仍能继续走。</li></ul>`;return `<ul><li><b>看实时电子屏：</b>以列车号、终点、站台和晚点信息为准，不要只依据购票时的站台。</li><li><b>给换乘留余量：</b>大站跨站台、寄存行李或找车厢都比想象中花时间。</li><li><b>到站后再决定市内交通：</b>用下方 App 比较地铁/公交和打车，晚间或多人带箱时再考虑网约车。</li></ul>`}
      function render(place){const name=place.display_name?.split(',')[0]||place.name||$('#place').value,country=place.address?.country_code||'',city=place.address?.city||place.address?.town||place.address?.municipality||'',type=inferType(name,$('#mode').value),typeName={airport:'机场',train:'火车站',metro:'地铁站'}[type],apps=toolsFor(country,city);current={name,lat:place.lat,lon:place.lon};$('#guide').innerHTML=`<div class="result-head"><div><div class="eyebrow">${typeName} · ${city?esc(city)+' · ':''}${country?country.toUpperCase():'欧洲地点'}</div><h2>${esc(name)} 出行攻略</h2></div><span class="pill">已于 ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 查询地点</span></div><div class="alert"><b>实用优先。</b> 先安装一款当地交通 App 和一款打车 App；到站后以 App 的实时班次、票价、上车点和站台信息为准。</div><div class="cards"><article class="card wide"><h3>① 建议先装这 3 个</h3>${appCards(apps)}</article><article class="card wide"><h3>② 从这里去哪里？</h3><p>输入酒店、住址或景点，直接打开从 <b>${esc(name)}</b> 出发的公共交通路线。</p><div class="route-field"><input class="input" id="finalDestination" placeholder="例如：你的酒店、住址或景点"/><button class="route" id="route">规划公交路线</button><button class="route secondary" id="placeMap">打开此枢纽</button></div><span class="route-hint" id="routeHint">Google Maps 会根据你的当前位置和实时交通提供路线选项。</span></article></div><p class="footnote">推荐组合综合当地运营商工具和广泛使用的出行服务；实际班次、票价、上车点请以 App 内信息和现场指引为准。</p>`;$('#route').onclick=()=>{const dest=$('#finalDestination').value.trim();if(!dest){$('#routeHint').textContent='先填一个最终目的地，例如酒店或景点。';return}window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(name)}&destination=${encodeURIComponent(dest)}&travelmode=transit`,'_blank','noopener')};$('#placeMap').onclick=()=>window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`,'_blank','noopener')}
      async function search(){const query=$('#place').value.trim();if(!query)return $('#status').textContent='请输入地点名称';$('#status').textContent='正在实时识别地点…';try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&q='+encodeURIComponent(query);const res=await fetch(url,{headers:{Accept:'application/json'}});const list=await res.json();if(!list.length)throw new Error('未找到');render(list[0]);$('#status').textContent='地点已识别 · 请完成官方核验'}catch(e){render({display_name:query});$('#status').textContent='未识别地点 · 已生成通用攻略'}}
      $('#generate').onclick=search;$('#place').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
    </script>
  </body>
</html>
